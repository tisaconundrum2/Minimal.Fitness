services:
  db:
    image: postgres:16-alpine
    container_name: minimal-fitness-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: minimal_fitness
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness_local_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d minimal_fitness"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: